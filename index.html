<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Log</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0b1d33;
  color: white;
  text-align: center;
}
.hidden { display: none; }

button {
  background: #1e90ff;
  border: none;
  color: white;
  padding: 14px 20px;
  margin: 8px;
  font-size: 16px;
  border-radius: 8px;
}

button.red { background: #c0392b; }

input {
  padding: 12px;
  margin: 6px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  width: 80%;
}

.card {
  background: #132f52;
  margin: 10px;
  padding: 12px;
  border-radius: 10px;
  text-align: left;
}

.tabbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #081629;
  display: flex;
}

.tabbar button {
  flex: 1;
  border-radius: 0;
}

/* MODALS */
.modal {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 10;
}
.modal-content {
  background: #0b1d33;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Enter Passcode</h2>
  <input type="password" id="code">
  <br>
  <button onclick="login()">Enter</button>
</div>

<!-- SITE SELECT -->
<div id="siteSelect" class="hidden">
  <h2>Select Site</h2>
  <button onclick="selectSite('Site A')">Site A</button>
  <button onclick="selectSite('Site B')">Site B</button>
  <button onclick="selectSite('Site C')">Site C</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <h2 id="siteTitle"></h2>

  <!-- CHECK IN -->
  <div id="checkin">
    <button onclick="openScanner()">📷 Scan QR</button>
    <button onclick="openManual()">✍️ Manual Entry</button>
  </div>

  <!-- SITE LIST -->
  <div id="list" class="hidden">
    <input placeholder="Search" oninput="renderList(this.value)">
    <button onclick="loadList()">🔄 Refresh</button>
    <div id="cards"></div>
  </div>
</div>

<div class="tabbar hidden" id="tabs">
  <button onclick="showTab('checkin')">CHECK IN</button>
  <button onclick="showTab('list')">SITE LIST</button>
</div>

<!-- MANUAL MODAL -->
<div id="manual" class="modal hidden">
  <div class="modal-content">
    <h3>Manual Check In</h3>
    <input id="manualTime" type="datetime-local">
    <input id="driver" placeholder="Driver">
    <input id="truck" placeholder="Truck">
    <br>
    <button onclick="manualCheckin()">Submit</button>
    <button onclick="closeManual()">Cancel</button>
  </div>
</div>

<!-- CAMERA SCANNER MODAL -->
<div id="scanner" class="modal hidden">
  <div class="modal-content">
    <video id="video" autoplay playsinline width="300"></video>
    <br>
    <button onclick="closeScanner()">Cancel</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwI-tNcSCKx4mMTghZ-TboGx0g0ePHO5FnVIXLRwfPqXP1DH1DVmQkgfRRyEthbJMlHhg/exec";
const PASSCODE = "test";

let SITE = "";
let LIST = [];
let videoStream;

// LOGIN
function login() {
  const passInput = document.getElementById("code");
  const c = passInput.value;

  if (c !== PASSCODE) return alert("Invalid passcode");

  document.getElementById("login").classList.add("hidden");
  document.getElementById("siteSelect").classList.remove("hidden");
}

// SITE SELECT
function selectSite(s) {
  SITE = s;
  document.getElementById("siteSelect").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("tabs").classList.remove("hidden");
  document.getElementById("siteTitle").innerText = s;
}

// TABS
function showTab(t) {
  closeManual();  // ensure manual modal closes if switching tabs
  closeScanner(); // ensure scanner closes if switching tabs
  document.getElementById("checkin").classList.toggle("hidden", t !== "checkin");
  document.getElementById("list").classList.toggle("hidden", t !== "list");
  if (t === "list") loadList();
}

// MANUAL ENTRY
function openManual() { 
  const now = new Date();
  const tzOffset = now.getTimezoneOffset() * 60000;
  const localISO = (new Date(now - tzOffset)).toISOString().slice(0,16);
  document.getElementById("manualTime").value = localISO;

  document.getElementById("manual").classList.remove("hidden"); 
}
function closeManual() { document.getElementById("manual").classList.add("hidden"); }
function manualCheckin() {
  const time = document.getElementById("manualTime").value;
  const driverVal = document.getElementById("driver").value;
  const truckVal = document.getElementById("truck").value;

  send("checkin", driverVal, truckVal, time);
  document.getElementById("driver").value = "";
  document.getElementById("truck").value = "";
  closeManual();
  alert("Checked In");
}

// SEND TO SCRIPT
function send(action, driver="", truck="", time="") {
  let url = `${API}?action=${action}&site=${encodeURIComponent(SITE)}&driver=${encodeURIComponent(driver)}&truck=${encodeURIComponent(truck)}`;
  if (time) url += `&time=${encodeURIComponent(time)}`;
  fetch(url);
}

// LOAD SITE LIST
function loadList() {
  fetch(`${API}?action=list&site=${encodeURIComponent(SITE)}`)
    .then(r => r.json())
    .then(rows => {
      LIST = rows.slice(1).filter(r => r[4] === "On Site");
      renderList();
    });
}

function renderList(query="") {
  const cardsDiv = document.getElementById("cards");
  cardsDiv.innerHTML = "";
  LIST.filter(r =>
    r[2].toLowerCase().includes(query.toLowerCase()) ||
    r[3].toLowerCase().includes(query.toLowerCase())
  ).forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    const timeIn = r[0] ? new Date(r[0]).toLocaleString() : "Unknown";
    card.innerHTML = `<b>${r[2]}</b> (${timeIn})<br>${r[3]}<br>
      <button class="red" onclick="checkout('${r[2]}')">SIGN OUT</button>`;
    cardsDiv.appendChild(card);
  });
}

// CHECKOUT
function checkout(driver) {
  send("checkout", driver);
  alert("Signed Out");
  loadList();
}

// CAMERA SCANNER MODAL
function openScanner() {
  document.getElementById("scanner").classList.remove("hidden");
  const video = document.getElementById("video");
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => { 
      video.srcObject = stream; 
      videoStream = stream;
      scanLoop();
    });
}

function closeScanner() {
  document.getElementById("scanner").classList.add("hidden");
  const video = document.getElementById("video");
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
  }
}

// BASIC QR SCANNER LOOP
function scanLoop() {
  const video = document.getElementById("video");
  if (!videoStream || document.getElementById("scanner").classList.contains("hidden")) return;

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

  // Using jsQR library would be best; for now we simulate plain text QR detection
  // If you have plain text: DRIVER|TRUCK in QR, simulate detection here:
  // Example simulation: we could parse from an actual QR library later
  // For now, just leave scanning to be handled by real jsQR integration

  requestAnimationFrame(scanLoop);
}
</script>

</body>
</html>
