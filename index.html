<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Log</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0b1d33;
  color: white;
  text-align: center;
}
.hidden { display: none; }

button {
  background: #1e90ff;
  border: none;
  color: white;
  padding: 14px 20px;
  margin: 8px;
  font-size: 16px;
  border-radius: 8px;
}

button.red { background: #c0392b; }

input {
  padding: 12px;
  margin: 6px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

.card {
  background: #132f52;
  margin: 10px;
  padding: 12px;
  border-radius: 10px;
  text-align: left;
}

.tabbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #081629;
  display: flex;
}

.tabbar button {
  flex: 1;
  border-radius: 0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Enter Passcode</h2>
  <input type="password" id="code">
  <br>
  <button onclick="login()">Enter</button>
</div>

<!-- SITE SELECT -->
<div id="siteSelect" class="hidden">
  <h2>Select Site</h2>
  <button onclick="selectSite('Site A')">Site A</button>
  <button onclick="selectSite('Site B')">Site B</button>
  <button onclick="selectSite('Site C')">Site C</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <h2 id="siteTitle"></h2>

  <!-- CHECK IN -->
  <div id="checkin">
    <button onclick="startScan()">📷 Scan QR</button>
    <button onclick="openManual()">✍️ Manual Entry</button>
    <video id="video" class="hidden" autoplay playsinline width="300"></video>
  </div>

  <!-- SITE LIST -->
  <div id="list" class="hidden">
    <input placeholder="Search" oninput="renderList(this.value)">
    <button onclick="loadList()">🔄 Refresh</button>
    <div id="cards"></div>
  </div>
</div>

<div class="tabbar hidden" id="tabs">
  <button onclick="showTab('checkin')">CHECK IN</button>
  <button onclick="showTab('list')">SITE LIST</button>
</div>

<!-- MANUAL MODAL -->
<div id="manual" class="hidden">
  <h3>Manual Check In</h3>
  <input id="driver" placeholder="Driver">
  <input id="truck" placeholder="Truck">
  <br>
  <button onclick="manualCheckin()">Submit</button>
  <button onclick="closeManual()">Cancel</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwI-tNcSCKx4mMTghZ-TboGx0g0ePHO5FnVIXLRwfPqXP1DH1DVmQkgfRRyEthbJMlHhg/exec"; // Update with your latest script URL
const PASSCODE = "test";

let SITE = "";
let LIST = [];

// LOGIN
function login() {
  const passInput = document.getElementById("code"); // reliable reference
  const c = passInput.value;

  if (c !== PASSCODE) return alert("Invalid passcode");

  document.getElementById("login").classList.add("hidden");
  document.getElementById("siteSelect").classList.remove("hidden");
}

// SITE SELECT
function selectSite(s) {
  SITE = s;
  document.getElementById("siteSelect").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("tabs").classList.remove("hidden");
  document.getElementById("siteTitle").innerText = s;
}

// TABS
function showTab(t) {
  document.getElementById("checkin").classList.toggle("hidden", t !== "checkin");
  document.getElementById("list").classList.toggle("hidden", t !== "list");
  if (t === "list") loadList();
}

// MANUAL ENTRY
function openManual() { document.getElementById("manual").classList.remove("hidden"); }
function closeManual() { document.getElementById("manual").classList.add("hidden"); }
function manualCheckin() {
  send("checkin", driver.value, truck.value);
  driver.value = truck.value = "";
  closeManual();
  alert("Checked In");
}

// SEND TO SCRIPT
function send(action, driver="", truck="") {
  fetch(`${API}?action=${action}&site=${encodeURIComponent(SITE)}&driver=${encodeURIComponent(driver)}&truck=${encodeURIComponent(truck)}`);
}

// LOAD SITE LIST
function loadList() {
  fetch(`${API}?action=list&site=${encodeURIComponent(SITE)}`)
    .then(r => r.json())
    .then(rows => {
      LIST = rows.slice(1).filter(r => r[4] === "On Site");
      renderList();
    });
}

function renderList(query="") {
  const cardsDiv = document.getElementById("cards");
  cardsDiv.innerHTML = "";
  LIST.filter(r =>
    r[2].toLowerCase().includes(query.toLowerCase()) ||
    r[3].toLowerCase().includes(query.toLowerCase())
  ).forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<b>${r[2]}</b><br>${r[3]}<br>
      <button class="red" onclick="checkout('${r[2]}')">SIGN OUT</button>`;
    cardsDiv.appendChild(card);
  });
}

// CHECKOUT
function checkout(driver) {
  send("checkout", driver);
  alert("Signed Out");
  loadList();
}

// BASIC QR SCANNER (text-based)
function startScan() {
  const v = video;
  v.classList.remove("hidden");
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => v.srcObject = stream);
  alert("Point camera at QR with text: DRIVER|TRUCK (Example: John Doe|Truck 123)");
}
</script>

</body>
</html>
